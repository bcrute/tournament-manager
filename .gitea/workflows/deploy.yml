name: deploy
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: docker-host
    env:
      # Gitea serves an internal Home LAN CA cert; bundle is mounted by the runner
      GIT_SSL_CAINFO: /etc/gitea-ca.crt
      NODE_EXTRA_CA_CERTS: /etc/gitea-ca.crt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mtg:latest .

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          # secret is base64-encoded: single-line values get masked reliably in logs
          echo "$VPS_SSH_KEY" | base64 -d > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          printf 'Host vps\n  HostName 74.208.222.65\n  User root\n  IdentityFile ~/.ssh/vps_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Ship image to VPS
        run: docker save mtg:latest | gzip | ssh vps 'gunzip | docker load'

      - name: Deploy
        run: |
          ssh vps 'mkdir -p /opt/apps/mtg'
          scp docker-compose.yml vps:/opt/apps/mtg/docker-compose.yml
          ssh vps 'cd /opt/apps/mtg && docker compose up -d'
          ssh vps 'docker image prune -f'
