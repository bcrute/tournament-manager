name: security

# Supply-chain scanning, moved off the deploy path.
#
# These check dependencies and patterns, which change when someone bumps a
# package or a new advisory lands — not on every push. Running them per-commit
# added minutes to every deploy to re-verify the same unchanged lockfiles.
#
# Weekly, plus on demand, plus whenever a dependency file actually changes.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "backend/requirements*.txt"
      - "frontend/package-lock.json"
      - ".gitea/workflows/security.yml"

jobs:
  scan:
    runs-on: docker-host
    env:
      GIT_SSL_CAINFO: /etc/gitea-ca.crt
      NODE_EXTRA_CA_CERTS: /etc/gitea-ca.crt
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # scanners run as sibling containers; the workspace lives in a docker
      # volume, so it must be shared via --volumes-from
      - name: Workspace visible to scanners
        run: docker run --rm --volumes-from "$(cat /etc/hostname)" -w "$PWD" python:3.12-slim test -f backend/app/table.py

      - name: semgrep
        run: docker run --rm --volumes-from "$(cat /etc/hostname)" -w "$PWD" semgrep/semgrep:latest semgrep scan --config p/ci --error --quiet .

      - name: pip-audit
        run: docker run --rm --volumes-from "$(cat /etc/hostname)" -w "$PWD" python:3.12-slim sh -c 'pip install -q pip-audit && pip-audit --strict -r backend/requirements.txt'

      - name: npm audit
        run: docker run --rm --volumes-from "$(cat /etc/hostname)" -w "$PWD/frontend" node:22-alpine sh -c 'npm ci --ignore-scripts --silent && npm audit --audit-level=high'
