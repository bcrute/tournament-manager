name: deploy

# Ported from .gitea/workflows/deploy.yml when deploys moved off the home
# runner. GitHub is now the only thing that deploys; Actions is switched off on
# the Gitea repo, so nothing ships from there.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two runs racing `docker compose up -d` against the same
# host can leave the VPS on whichever image finished loading second, not
# whichever commit is newer. Deploys are not cancelled mid-flight -- a half-shipped
# image is worse than a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # pinned to the v4.2.2 commit SHA (mutable tags are a supply-chain risk)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Supply-chain scanning lives in security.yml: weekly, on demand, and
      # whenever a dependency file changes. It was re-verifying unchanged
      # lockfiles on every push and dominating time-to-deploy.
      # Runtime target only: no test stage is built here. The image build was
      # 2m26s of a 2m43s deploy, almost all of it pytest, to re-run a suite
      # that had already been run locally by `scripts/ci`. Deploys are the
      # thing that happens most often and the thing least in need of a second
      # opinion.
      #
      # Nothing else gates a push to main, so this is on the person pushing:
      # run `scripts/ci` first. `full.yml` runs everything including Playwright
      # when you ask it to.
      - name: Build image
        run: docker build --target runtime -t mtg:latest .

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          # secret is base64-encoded: single-line values get masked reliably in logs
          echo "$VPS_SSH_KEY" | base64 -d > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          # Host key pinned, not accept-new. On the home runner TOFU was cheap --
          # the runner was long-lived and the first connection crossed the LAN.
          # Here every run is a fresh VM taking its first look at the host over
          # the public internet, so accept-new would trust whatever answers.
          printf '74.208.222.65 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKbbbzXYmO6zVT2U2f8/Mvgg8xaTpCXEPQn7JFHKNgSS\n' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host vps\n  HostName 74.208.222.65\n  User root\n  IdentityFile ~/.ssh/vps_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Ship image to VPS
        run: docker save mtg:latest | gzip | ssh vps 'gunzip | docker load'

      # Before the new image starts and runs its migrations. On 2026-08-04 a
      # deploy applied a schema migration with no backup in existence
      # anywhere; a bad one would have been unrecoverable. Failing here fails
      # the deploy on purpose — shipping a migration over an unprotected
      # database is the thing worth stopping for.
      - name: Back up the database first
        run: |
          ssh vps 'mkdir -p /opt/apps/mtg'
          scp deploy/backup.sh vps:/opt/apps/mtg/backup.sh
          ssh vps 'chmod +x /opt/apps/mtg/backup.sh && /opt/apps/mtg/backup.sh --label predeploy'

      # Who the admins are, from repository configuration rather than a file
      # edited by hand on the host. The property that matters is unchanged:
      # privilege comes from the environment, never from a column in
      # `accounts` (docs/security.md T16). What changes is who can grant it —
      # repo admin plus a deploy, instead of an SSH session. That is not a
      # widening: anyone who can set this variable can already ship arbitrary
      # code to this host through this workflow.
      #
      # Set it in Settings → Secrets and variables → Actions → Variables, as
      # `TABLE_ADMINS`: a comma-separated list of account usernames, matched
      # case-insensitively. A *variable*, not a secret — it is configuration,
      # and a masked value that never appears in a log is harder to review
      # than one that does. Unset or empty removes the line, and the app then
      # has no admin surface at all, which is the safe default and the state
      # this repo shipped in until now.
      #
      # Only this one key is touched. mtg.env also holds TABLE_IP_SALT and the
      # mail credentials, which exist only on the host — rewriting the file
      # would reset every ban and stop mail.
      - name: Set the admin list on the VPS
        env:
          # never interpolated into the run script; it travels through the
          # environment here and stdin below, so its content can't become shell
          TABLE_ADMINS: ${{ vars.TABLE_ADMINS }}
        run: |
          changed=$(printf '%s' "$TABLE_ADMINS" | ssh vps '
            set -eu
            umask 077
            cd /opt/apps/mtg
            admins=$(cat)
            touch mtg.env
            grep -v "^TABLE_ADMINS=" mtg.env > mtg.env.next || true
            if [ -n "$admins" ]; then printf "TABLE_ADMINS=%s\n" "$admins" >> mtg.env.next; fi
            if cmp -s mtg.env mtg.env.next; then
              rm -f mtg.env.next
            else
              mv mtg.env.next mtg.env && chmod 600 mtg.env && echo changed
            fi
          ')
          # compose recreates on a new image, which nearly every deploy has —
          # but a re-run on an unchanged image would otherwise leave the old
          # container, and its environment, running.
          if [ "$changed" = changed ]; then
            echo 'admin list updated'
            echo 'RECREATE=--force-recreate' >> "$GITHUB_ENV"
          fi

      - name: Deploy
        run: |
          scp docker-compose.yml vps:/opt/apps/mtg/docker-compose.yml
          ssh vps "cd /opt/apps/mtg && docker compose up -d ${RECREATE:-}"

      # The VPS Caddy fronts every app on the host (social.skadoosh.dev too).
      # This repo ships ONLY its own vhost file; the root Caddyfile and other
      # apps' sites/*.caddy are never written from here. Validation runs against
      # the merged config, so a bad mtg.caddy fails the deploy rather than the
      # other sites; reload is graceful, so on any failure Caddy keeps serving
      # the old config. Layout and one-time migration: deploy/README.md.
      - name: Ship Caddy vhost (mtg only)
        run: |
          if ! ssh vps 'test -d /opt/caddy/sites'; then
            echo "::warning::/opt/caddy/sites missing — per-site Caddy layout not migrated yet (see deploy/README.md); skipping vhost ship"
            exit 0
          fi
          ssh vps 'cp /opt/caddy/sites/mtg.caddy /opt/caddy/mtg.caddy.prev 2>/dev/null || true'
          scp deploy/caddy/sites/mtg.caddy vps:/opt/caddy/sites/mtg.caddy
          if ! ssh vps 'docker exec caddy caddy validate --config /etc/caddy/Caddyfile'; then
            echo 'vhost failed validation; restoring previous file, running Caddy untouched'
            ssh vps 'mv /opt/caddy/mtg.caddy.prev /opt/caddy/sites/mtg.caddy || rm -f /opt/caddy/sites/mtg.caddy'
            exit 1
          fi
          ssh vps 'docker exec caddy caddy reload --config /etc/caddy/Caddyfile && rm -f /opt/caddy/mtg.caddy.prev'

      # Label-scoped: other apps deploy to this host the same way, and a bare
      # prune would collect their images too.
      - name: Prune old mtg images
        run: ssh vps 'docker image prune -f --filter label=app=mtg'
