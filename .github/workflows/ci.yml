name: ci

# The gates, for commits that are not going to production.
#
# Pushes to main are covered by deploy.yml, which runs this same build before
# it ships anything — so this deliberately does not trigger on main. Adding it
# there would build the identical image twice per push for one signal.
#
# The build IS the test suite — see Dockerfile: the frontend stage runs vitest
# and the production build, the backend-test stage runs pytest behind a 90%
# coverage gate. A red build here means a deploy that would have failed.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # pinned to the v4.2.2 commit SHA (mutable tags are a supply-chain risk)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build image (runs pytest + coverage gate + vitest + coverage gate)
        run: docker build -t mtg:latest .
