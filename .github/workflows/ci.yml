name: ci

# The automated gate, for changes arriving through a pull request.
#
# It does not trigger on main. It used to be described as redundant there,
# because deploy.yml ran the same build — that stopped being true on
# 2026-08-02, when the deploy build dropped to `--target runtime` and stopped
# running tests at all. A push straight to main is now gated by whoever pushes
# running `scripts/ci` first, and by nothing else.
#
# `--target test` builds the two suite stages: vitest behind the thresholds in
# vite.config.ts, and pytest behind a 90% coverage gate. It does not build the
# runtime image — deploy.yml does that, and since 2026-08-02 the deploy build
# no longer runs any tests, so this is the automated gate rather than a
# duplicate of one.
#
# Playwright is NOT here. It needs a browser download and a live server, which
# is minutes rather than seconds; it lives in full.yml, on demand.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # pinned to the v4.2.2 commit SHA (mutable tags are a supply-chain risk)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run the suites (vitest + coverage, pytest + coverage gate)
        run: docker build --target test .
